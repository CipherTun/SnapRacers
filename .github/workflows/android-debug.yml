name: Android debug APKs

on:
  push:
    branches:
      - development/car-game-android
  pull_request:
    branches:
      - development/car-game-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapracers-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    name: Build Android debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out SnapRacers
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Download Godot 4.7.2 editor
        run: |
          mkdir -p tools/godot
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot-editor.zip"
          unzip -oq "$RUNNER_TEMP/godot-editor.zip" -d tools/godot
          chmod +x tools/godot/Godot_v4.7.2-stable_linux.x86_64
          tools/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install matching Godot export templates
        run: |
          TEMPLATE_DIR="tools/godot/editor_data/export_templates/4.7.2.stable"
          EXTRACT_DIR="$RUNNER_TEMP/godot-template-extract"

          mkdir -p "$TEMPLATE_DIR" "$EXTRACT_DIR"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            --output "$RUNNER_TEMP/godot-templates.tpz"

          unzip -oq "$RUNNER_TEMP/godot-templates.tpz" -d "$EXTRACT_DIR"

          if [ -d "$EXTRACT_DIR/templates" ]; then
            cp -a "$EXTRACT_DIR/templates/." "$TEMPLATE_DIR/"
          else
            cp -a "$EXTRACT_DIR/." "$TEMPLATE_DIR/"
          fi

          test -s "$TEMPLATE_DIR/android_source.zip"
          test -s "$TEMPLATE_DIR/version.txt"
          echo "Godot Android templates installed successfully."

      - name: Build ARM64 debug APK
        run: |
          bash tools/build-android.sh
          test -s build/snapracers-debug.apk
          mv build/snapracers-debug.apk \
            build/snapracers-arm64-debug.apk

      - name: Build ARM32 debug APK
        run: |
          bash tools/build-android.sh --arm32
          test -s build/snapracers-arm32.apk

      - name: Verify APK files
        run: |
          ls -lh \
            build/snapracers-arm64-debug.apk \
            build/snapracers-arm32.apk

          file \
            build/snapracers-arm64-debug.apk \
            build/snapracers-arm32.apk

          sha256sum \
            build/snapracers-arm64-debug.apk \
            build/snapracers-arm32.apk

      - name: Upload separate debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: SnapRacers-Android-debug-APKs
          path: |
            build/snapracers-arm64-debug.apk
            build/snapracers-arm32.apk
          if-no-files-found: error
          retention-days: 14
